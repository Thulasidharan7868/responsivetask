<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color:wheat;
        }
        .con {
            width: 90%;
            /* height: 100vh; */
            margin: auto;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: whitesmoke;
        }

        .card1 {
            width: 90%;
            height: 350px;
            margin: auto;
            border-radius: 20px;
            margin-bottom: 20px;
            /* background-color: #17466b; */
        }
        .cards{
            width: 90%;
            /* height: 100px; */
            display: flex;
            justify-content: center;
            gap: 25px;
            /* background-color: red; */
        }
        .card1 img {
            width: 100%;
            height: 100%;
            border-radius: 20px;

        }

        .card2 {
            width: 50%;
            /* margin: auto; */
            border-radius: 20px;
            background-color: #ccc;
            padding: 30px;
            justify-content: center;
        }

        .card3 {

            width: 50%;
            /* margin: auto; */
            border-radius: 20px;
            background-color: #ccc;
            padding: 30px;

        }
        .cards h3{
            color:#17466b;
            font-size: 25px;
            margin-bottom: 15px;
        }
        .cards p{
            color: #555;
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        button {
            background-color: #17466b;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
        }
        @media screen and (max-width:768px){
            .con{
                /* display:none;
                background-color: #ccc; */
                width: 90%;
                padding: 20px;
                gap: 20px;
                display: flex;
                flex-direction: row;
            }
            .card1{
                width: 300px;
            }
            .card2, .card3{
                width: 200px;
                height: 300px;
                padding: 20px;
                justify-content: center;
                align-items: center;
            }
            .cards h3{
                font-size: 18px;
            }
            .cards p{
                font-size: 15px;
            }
        }

        @media screen and (max-width:425px){
            .con{
                /* display:none;
                background-color: #ccc; */
                width: 90%;
                padding: 20px;
                gap: 20px;
                display: flex;
                flex-direction: column;

            }
            .card1{
                width: 300px;
            }
            .cards{
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .card2, .card3{
                width: 90%;
                height: 300px;
                padding: 20px;
                /* display: flex; */
                justify-content: center;
                align-items: center;    
                /* flex-direction: column; */
            }
            .cards h3{
                font-size: 18px;
            }
            .cards p{
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="con">
        <div class="card1">
            <img src="./image/laptop.png" alt="">
        </div>
        <div class="cards">
            <div class="card2">
                <h3>Web Development</h3>
                <p>Learn HTML ,CSS and JavaScript with practical projects and responsive website development.</p>
                <button>Learn More</button>
            </div>
            <div class="card3">
                <h3>Responsive Design</h3>
                <p>Create websites that automatically adjust their layout according to desktop,tablet and mobile screens.</p>
                <button>Explore</button>
            </div>
        </div>
    </div>
</body>

</html>
